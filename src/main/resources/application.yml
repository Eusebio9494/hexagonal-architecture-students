server:
  port: ${PORT}
spring:
    application:
      name: students
    jackson:
      default-property-inclusion: NON_NULL
    datasource:
      url: ${DB_HOSTNAME}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect
